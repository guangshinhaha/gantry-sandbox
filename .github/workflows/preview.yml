name: preview
# Smoke-tests each PR's preview deployment (Playwright tests tagged @smoke).
# Set platform to railway or vercel. Skips itself without the platform secret
# (Railway) or without @smoke tests.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ["docs/**", "**/*.md"]
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  preview:
    if: ${{ !github.event.pull_request.draft }}
    uses: guangshinhaha/gantry/.github/workflows/preview.yml@main
    with:
      platform: railway
      # lighthouse: true            # report-only scan after smoke passes
      # lighthouse-urls: "/ /login"  # paths to scan (default /)
      # lighthouse-min-a11y: 90     # fail below this accessibility score
    secrets: inherit
    permissions:
      contents: read
      pull-requests: write
      deployments: read
