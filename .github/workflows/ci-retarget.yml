name: ci-retarget
# SPIKE gantry#134: a base change re-runs gantry's ci against the new base, in
# its own workflow so a title/body edit never adds a run to `ci`.
on:
  pull_request:
    types: [edited]

concurrency:
  group: ${{ github.event.changes.base && format('ci-{0}', github.event.pull_request.number) || format('ci-edit-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  gantry:
    if: ${{ !github.event.pull_request.draft && github.event.changes.base }}
    uses: guangshinhaha/gantry/.github/workflows/ci.yml@main
    permissions:
      contents: read
      pull-requests: read
