name: mutation
# Mutation testing on changed files. Off until the repo has a stryker config
# (gantry-init adds one for Vitest/Jest repos).
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch: # full run, on demand
concurrency:
  group: mutation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  mutation:
    if: ${{ !github.event.pull_request.draft }}
    uses: guangshinhaha/gantry/.github/workflows/mutation.yml@guangshinhaha/issue-26-18-build-yml
    with:
      gantry-ref: guangshinhaha/issue-26-18-build-yml
    permissions:
      contents: read
      pull-requests: write
