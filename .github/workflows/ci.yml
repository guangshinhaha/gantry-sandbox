name: ci
on:
  push:
    branches: ['gy66/**']
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  gantry:

    uses: guangshinhaha/gantry/.github/workflows/ci.yml@b854b7b5e1a83de88396f60441d8b88fc4b6daf5
    permissions:
      contents: read
      pull-requests: read
