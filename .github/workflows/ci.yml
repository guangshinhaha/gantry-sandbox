name: ci
# vfy98: verifier caller for gantry PR #98, pinned to its head. Throwaway.
on:
  push:
    branches: ["vfy98/**", "!vfy98/head-**"]
  pull_request:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}${{ github.event.action == 'edited' && !github.event.changes.base && format('-edit-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gantry:
    if: ${{ github.event.action != 'edited' || github.event.changes.base }}
    uses: guangshinhaha/gantry/.github/workflows/ci.yml@d1ccc5bc4bc195108927c9ee5d28e1e3a4420929
    permissions:
      contents: read
      pull-requests: read
