name: ci
# Docs-only changes are skipped inside the shared workflow (not with paths-ignore),
# so the required `gantry / ci-ok` check still reports.
on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR cancels its run still in flight. Main is never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gantry:
    uses: guangshinhaha/gantry/.github/workflows/ci.yml@7220b670a4646e29e994d5bc9957e55ecf7fe13a
    permissions:
      contents: read
      pull-requests: read
    # with:
    #   runs-on: '["self-hosted","gantry"]'   # once your runner is up
    #   e2e: true
