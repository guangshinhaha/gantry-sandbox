name: ci
on:
  push:
    branches: ['gy65/**']
  pull_request:
    types: [opened, synchronize, reopened, edited]
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}${{ github.event.action == 'edited' && !github.event.changes.base && format('-edit-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  gantry:
    if: ${{ github.event.action != 'edited' || github.event.changes.base }}
    uses: guangshinhaha/gantry/.github/workflows/ci.yml@b854b7b5e1a83de88396f60441d8b88fc4b6daf5
    permissions:
      contents: read
      pull-requests: read
