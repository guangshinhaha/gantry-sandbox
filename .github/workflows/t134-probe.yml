name: t134-probe
on:
  pull_request:
    types: [opened]
permissions:
  contents: read
  pull-requests: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          PAYLOAD_BASE: ${{ github.event.pull_request.base.ref }}
          PAYLOAD_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SHA: ${{ github.sha }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          echo "attempt=$ATTEMPT payload_base=$PAYLOAD_BASE payload_base_sha=$PAYLOAD_BASE_SHA github.sha=$SHA"
          live=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR")
          echo "live_base=$(echo "$live" | jq -r .base.ref) live_merge_sha=$(echo "$live" | jq -r .merge_commit_sha)"
          echo "github.sha parents=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA" --jq '[.parents[].sha]|join(",")')"
