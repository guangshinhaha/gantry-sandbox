name: secrets-scan
# Daily scan of every branch and all history for keys. It never blocks a PR:
# a leak turns this run red and opens one issue (gantry#36). Run it by hand from
# the Actions tab.
on:
  schedule:
    - cron: "23 1 * * *"
  workflow_dispatch:
concurrency:
  group: secrets-scan
  cancel-in-progress: false
jobs:
  gantry:
    uses: guangshinhaha/gantry/.github/workflows/secrets-scan.yml@f211566b9e8fa6885e2a6ffaf131151afe7cf6b2
    permissions:
      contents: read
      issues: write
    # with:
    #   runs-on: '["self-hosted","gantry"]'   # once your runner is up
